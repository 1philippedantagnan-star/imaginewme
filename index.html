<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EURODRIP · Zapatillas</title>
  <meta name="description" content="Catálogo de zapatillas EURODRIP: tallas en stock y pedidos por WhatsApp o Instagram.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="wrap">
  <header>
    <h1 class="brand" id="brand"></h1>
    <div class="meta">
      <span id="eslogan"></span>
      <span id="stamp"></span>
      <span id="links"></span>
    </div>
  </header>

  <div class="bar">
    <div class="row" id="sizes" role="group" aria-label="Filtrar por talla"></div>
    <div class="row" id="brands" role="group" aria-label="Filtrar por marca"></div>
  </div>

  <p class="count" id="count" aria-live="polite"></p>
  <main class="grid" id="grid"></main>
  <p class="empty" id="empty" hidden>No hay modelos con esa combinación. Prueba otra talla o marca.</p>

  <footer>
    <span>Stock sujeto a disponibilidad. Confirma tu talla por WhatsApp o Instagram antes de pagar.</span>
    <span id="contacto"></span>
  </footer>
</div>

<dialog id="dlg" aria-label="Detalle del modelo">
  <button class="x" id="close" aria-label="Cerrar">×</button>
  <div class="sheet" id="sheet"></div>
</dialog>


  <script src="config.js"></script>
  <script src="inventario.js"></script>
  <script src="app.js"></script>
</body>
</html>
